    ansible_ssh_extra_args: '-o IPQoS=none -oPubkeyAuthentication=no'
    ansible_connect_timeout: 60
    ansible_command_timeout: 60
    ansible_buffer_read_timeout: 2
    ntp_servers:
      - 162.159.200.1
      - 162.159.200.123
    vlans:
      - vlan_id: 10
        name: Data
      - vlan_id: 20
