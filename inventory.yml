    routers:
      hosts:
        routeur1:
          ansible_host: 192.168.10.10  # L'IP de R1 sur le réseau 10
    switches:
      hosts:
        switch1:
          ansible_host: 192.168.20.20 # Nouvelle IP de IOU1
        switch2:
          ansible_host: 192.168.10.21
  vars:
    ansible_network_os: cisco.ios.ios
    ansible_user: admin
    ansible_password: Kernel@2026
