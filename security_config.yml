---
- name: Gestion des utilisateurs et de la sécurité
  hosts: routers
  gather_facts: no

  tasks:
    - name: S'assurer que l'utilisateur admin existe avec un mot de passe sécurisé
      cisco.ios.ios_user:
        name: admin
        privilege: 15
        configured_password: "Kernel@2026"
        state: present
        update_password: always

    - name: S'assurer que SSH version 2 est activé
      cisco.ios.ios_config:
        lines:
          - ip ssh version 2

    - name: S'assurer que les lignes VTY acceptent le SSH
      cisco.ios.ios_config:
        lines:
          - login local
          - transport input ssh
        parents: line vty 0 4
